<!DOCTYPE html>
<html lang="zh-CN" class="mdui-theme-light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XQFChat · 登录</title>
    <link rel="stylesheet" href="./src/css/login.css">
    <link rel="shortcut icon" href="./unpackage/res/icons/192x192.png" type="image/x-icon">
    <script src="/lib/mdui.global.min.js"></script>
    <script type="module" src="./src/js/login.js"></script>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <mdui-icon style="font-size: 48px;">chat</mdui-icon>
            </div>
            <div class="title">Flmp Chat</div>
            <div class="subtitle" id="statusText">正在检测登录状态...</div>
        </div>

        <!-- 检测中：旋转进度 -->
        <div id="checkingSpinner" style="text-align: center; margin-top: 24px;">
            <mdui-circular-progress></mdui-circular-progress>
        </div>

        <!-- 未登录：引导卡片 -->
        <mdui-card class="login-card" variant="outlined" id="notLoggedInCard" style="display: none;">
            <div style="text-align: center; padding: 16px 0;">
                <mdui-icon style="font-size: 40px; opacity: 0.5;">login</mdui-icon>
                <div style="margin-top: 12px; font-size: 15px; opacity: 0.8;">
                    请前往 Flmp 统一账户中心登录
                </div>
                <div style="margin-top: 4px; font-size: 13px; opacity: 0.5;">
                    登录后 Cookie 将自动同步，无需重复输入密码
                </div>
            </div>
            <mdui-button id="goLoginBtn" variant="filled" full-width>
                前往登录
            </mdui-button>
        </mdui-card>

        <!-- 错误状态 -->
        <mdui-card class="login-card" variant="outlined" id="errorCard" style="display: none;">
            <div style="text-align: center; padding: 16px 0;">
                <mdui-icon style="font-size: 40px; color: rgb(var(--mdui-color-error));">error</mdui-icon>
                <div style="margin-top: 12px; font-size: 15px;" id="errorText">
                    检测登录状态失败，请检查网络后重试
                </div>
            </div>
            <mdui-button id="retryBtn" variant="outlined" full-width>
                重新检测
            </mdui-button>
        </mdui-card>

        <div class="login-footer">
            <div class="footer-content">
                <div class="footer-links">
                    <a href="https://blog.xiaofengqwq.com" class="footer-link">作者博客</a>
                    <span class="divider">|</span>
                    <a href="https://xiaofengqwq.com" class="footer-link">作者主页</a>
                    <span class="divider">|</span>
                    <a href="https://github.com/XiaoFeng-QWQ/XQFChat" target="_blank" class="footer-link">开源地址</a>
                </div>
                <div class="copyright">
                    © 2026 XQFChat. Open Source under the GNU GPL License.
                </div>
            </div>
        </div>
    </div>
    <mdui-fab id="theme-toggle" icon="dark_mode"></mdui-fab>
</body>

</html>
